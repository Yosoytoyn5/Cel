<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Acceso Usuario - Barra de texto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: url('https://wallpapers.com/images/hd/red-and-green-4k-pc-houses-8d7ckpaq0ee576ko.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .search-box {
            display: flex;
            flex-direction: row;
            gap: 12px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            outline: none;
            background: rgba(153, 53, 53, 0.6);
            backdrop-filter: blur(8px);
            color: white;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        input[type="text"]:focus {
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        button {
            padding: 16px 28px;
            background: rgba(184, 71, 71, 0.6);
            backdrop-filter: blur(8px);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }

        button:hover {
            background: rgba(255, 0, 0, 0.8);
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Estilo específico para el botón Registrar */
        .registrar-btn {
            background: rgba(180, 60, 50, 0.7);
        }
        
        .registrar-btn:hover {
            background: rgba(200, 70, 60, 0.9);
        }

        /* ========== RESPONSIVE PARA MÓVIL ========== */
        
        @media (max-width: 768px) {
            .search-box {
                max-width: 90%;
                gap: 10px;
            }
            
            input[type="text"] {
                padding: 14px 18px;
                font-size: 15px;
            }
            
            button {
                padding: 14px 24px;
                font-size: 15px;
            }
        }
        
        @media (max-width: 600px) {
            .search-box {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            input[type="text"] {
                flex: 1 1 100%;
                order: 1;
            }
            
            .enviar-btn {
                order: 2;
            }
            
            .registrar-btn {
                order: 3;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            
            .search-box {
                flex-direction: column;
                gap: 12px;
                width: 100%;
                max-width: 100%;
            }
            
            input[type="text"] {
                width: 100%;
                padding: 16px 18px;
                font-size: 16px;
                text-align: left;
            }
            
            button {
                width: 100%;
                padding: 14px 20px;
                font-size: 16px;
                font-weight: 600;
            }
        }
        
        @media (max-width: 360px) {
            input[type="text"] {
                padding: 14px 16px;
                font-size: 14px;
            }
            
            input[type="text"]::placeholder {
                font-size: 13px;
            }
            
            button {
                padding: 12px 18px;
                font-size: 14px;
            }
        }
        
        @media (hover: none) and (pointer: coarse) {
            button {
                -webkit-tap-highlight-color: rgba(255, 255, 255, 0.3);
            }
            
            input[type="text"] {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="search-box">
        <input type="text" id="textInput" placeholder="Ingresa tu usuario...">
        <button id="submitBtn" class="enviar-btn">Enviar</button>
        <button id="registrarBtn" class="registrar-btn">Registrar</button>
    </div>

    <script>
        const input = document.getElementById('textInput');
        const enviarBtn = document.getElementById('submitBtn');
        const registrarBtn = document.getElementById('registrarBtn');

        // Lista de usuarios válidos
        const USUARIOS_VALIDOS = ["Marco", "Sain", "Ana", "Luis", "Carlos"];

        function verificarYRedirigir() {
            const texto = input.value.trim();
            
            if (texto === "") {
                alert("⚠️ Por favor, escribe un nombre de usuario.");
            } 
            else if (!USUARIOS_VALIDOS.includes(texto)) {
                alert(`❌ Usuario incorrecto. Acceso solo para:`);
            }
            else {
                sessionStorage.setItem("textoEnviado", texto);
                window.location.href = "index2.html";
            }
        }

        function irARegistro() {
            // Redirige directamente a la página de registro
            window.location.href = "Reguistro.html";
        }

        enviarBtn.addEventListener('click', verificarYRedirigir);
        registrarBtn.addEventListener('click', irARegistro);
        
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                verificarYRedirigir();
            }
        });
        
        input.addEventListener('touchstart', function() {
            this.focus();
        });
    </script>
</body>
</html>
